<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/x-icon;base64," sizes="any" />
  <title>成绩查询系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .btn { display:inline-block; padding: 12px 40px; background: #1890ff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #40a9ff; }
    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .login-box { margin: 40px auto; padding: 24px; }
      .btn { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-page">
      <div class="login-box">
        <div style="text-align: center; margin-bottom: 24px;">
          <img src="data:image/x-icon;base64," style="width:60px; height:60px; margin-bottom: 8px;">
          <h1 style="font-size: 22px; margin: 0;">柒小白自动阅卷系统</h1>
          <p style="color: #666; font-size: 14px; margin-top: 8px;">学生成绩查询平台</p>
        </div>
        <div style="text-align:center;">
          <div style="font-size:56px; font-weight:700; color:#1890ff; margin-bottom:8px;">404</div>
          <h2 style="font-size:20px; color:#333; margin:0 0 12px;">页面不存在</h2>
          <p style="color:#888; font-size:14px; line-height:1.8; margin-bottom:24px;">链接可能已过期，或您访问的地址有误。<br>请返回首页重新查询成绩。</p>
          <a href="index.html" class="btn">返回首页查询成绩</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
